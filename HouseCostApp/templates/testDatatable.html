<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <title>Admin Page</title>
</head>
<body>
    <div class="container mt-5">
        <div class="card bg-dark text-white mb-3">
            <div class="card-header bg-secondary text-center">
                <h2>Admin Page</h2>
            </div>
            <div class="card-body">
                <div class="card bg-dark text-white mb-3">
                    <div class="card-header bg-secondary text-center">
                        <h2>User Details</h2>
                    </div>
                    <div class="card-body">
                        <table id="userTable" class="table table-dark table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">S/N</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Created At</th>
                                    <th scope="col">Last Login</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                               
                                    <tr>
                                        <td>1</td>
                                        <td>James Mwakalinga</td>
                                        <td>oooooh</td>
                                        <td>1232</td>
                                        <td>11111</td>
                                        <td>
                                            <form method="POST" action="">
                                             
                                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                            </form>
                                        </td>
                                    </tr>
                              
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery, Bootstrap, and DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha384-oXq9m74y3RZyb0Hg4RhWQ7W6L9mL5nP7O6PiD9UMD61ZV2V6QcsA6ss3Of3XN2o5" crossorigin="anonymous"></script>
    <script>
        var $j = jQuery.noConflict();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2FzYMiN1GMnAx0F6gIwH7C4S/s6SMxXSV2KNROllAXcSD2S7BU7bXQqkn3y" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $j(document).ready(function() {
            $j('#userTable').DataTable();
        });
    </script>
</body>
</html>
